<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>五十音学习 · 平假名练习</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 16px; }
    header {
      text-align: center;
      padding: 24px 0 16px;
    }
    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 18px;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      flex-shrink: 0;
      padding: 10px 16px;
      border: 2px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab:hover { border-color: var(--primary-light); color: var(--primary); }
    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* Chart */
    .row-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row-title:first-child { margin-top: 0; }
    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .kana-grid.narrow { grid-template-columns: repeat(3, 1fr); }
    .kana-item {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px 4px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .kana-item:hover, .kana-item:active {
      background: #eff6ff;
      border-color: #93c5fd;
      transform: translateY(-1px);
    }
    .kana-item .k { font-size: 1.7rem; font-weight: 500; display: block; line-height: 1.2; }
    .kana-item .r { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* Practice */
    .mode-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      justify-content: center;
    }
    .mode-btn {
      padding: 8px 14px;
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-btn.active {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
    }

    .progress-wrap {
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s;
      width: 0%;
    }
    .score-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .q-kana {
      font-size: 4.8rem;
      font-weight: 500;
      text-align: center;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }
    .q-roma {
      font-size: 2rem;
      font-weight: 600;
      color: var(--primary);
      text-align: center;
      min-height: 48px;
      margin: 12px 0;
    }
    .q-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .opt {
      padding: 14px;
      font-size: 1.35rem;
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .opt:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
    .opt.correct { background: #dcfce7; border-color: var(--success); color: #166534; }
    .opt.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
    .opt:disabled { cursor: default; }

    .input-wrap { text-align: center; margin: 16px 0; }
    .input-wrap input {
      width: 100%;
      max-width: 260px;
      padding: 12px 16px;
      font-size: 1.5rem;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
    }
    .input-wrap input:focus { border-color: var(--primary); }

    .feedback {
      text-align: center;
      min-height: 28px;
      font-weight: 600;
      font-size: 1rem;
      margin: 8px 0 16px;
    }
    .feedback.ok { color: var(--success); }
    .feedback.ng { color: var(--danger); }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-main { background: var(--primary); color: #fff; }
    .btn-main:hover { background: #1d4ed8; }
    .btn-sub { background: #e2e8f0; color: var(--text); }
    .btn-sub:hover { background: #cbd5e1; }
    .btn-speak {
      background: #f0f9ff;
      color: var(--primary);
      border: 2px solid #bae6fd;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .result {
      text-align: center;
      padding: 28px 16px;
    }
    .result h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .result .big { font-size: 2.8rem; font-weight: 700; color: var(--primary); margin: 12px 0; }

    /* Sentences */
    .sentence-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .sentence-jp {
      font-size: 1.35rem;
      font-weight: 500;
      margin-bottom: 6px;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }
    .sentence-roma {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .sentence-zh {
      font-size: 0.95rem;
      color: #334155;
    }
    .sentence-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .sentence-actions button {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: 500;
    }
    .sentence-actions button:hover { background: #eff6ff; border-color: #93c5fd; }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-btn {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      color: var(--muted);
    }
    .filter-btn.active {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .hidden { display: none !important; }
    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .q-kana { font-size: 3.8rem; }
      .options { grid-template-columns: 1fr; }
      .kana-item .k { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>あいうえお 五十音学习</h1>
      <p>平假名认读 · 练习 · 句子</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="chart">五十音图</button>
      <button class="tab" data-tab="quiz">认读练习</button>
      <button class="tab" data-tab="write">听写练习</button>
      <button class="tab" data-tab="sentence">句子练习</button>
    </div>

    <!-- 五十音图 -->
    <div id="chart" class="panel active">
      <div class="card">
        <div class="row-title">清音</div>
        <div class="kana-grid" id="grid-seion"></div>

        <div class="row-title">浊音 · 半浊音</div>
        <div class="kana-grid" id="grid-daku"></div>

        <p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-top:16px;">
          点击假名可发音并显示罗马音
        </p>
      </div>
    </div>

    <!-- 认读练习 -->
    <div id="quiz" class="panel">
      <div class="card">
        <div class="mode-btns">
          <button class="mode-btn active" data-mode="k2r">看假名选罗马音</button>
          <button class="mode-btn" data-mode="r2k">看罗马音选假名</button>
        </div>

        <div id="quiz-main">
          <div class="progress-wrap"><div class="progress-bar" id="quiz-bar"></div></div>
          <div class="score-line">
            <span>第 <b id="quiz-cur">1</b> / <span id="quiz-total">20</span> 题</span>
            <span>正确 <b id="quiz-ok">0</b></span>
          </div>

          <div class="q-kana" id="quiz-kana"></div>
          <div class="q-roma hidden" id="quiz-roma"></div>
          <div class="q-hint" id="quiz-hint">请选择正确的罗马音</div>

          <div class="options" id="quiz-opts"></div>
          <div class="feedback" id="quiz-fb"></div>

          <div class="btn-row">
            <button class="btn btn-sub" id="quiz-skip">跳过</button>
            <button class="btn btn-speak" id="quiz-speak">🔊 发音</button>
            <button class="btn btn-main hidden" id="quiz-next">下一题</button>
          </div>
        </div>

        <div class="result hidden" id="quiz-result">
          <h2>练习完成！</h2>
          <div class="big" id="quiz-score">0%</div>
          <p id="quiz-msg"></p>
          <div class="btn-row" style="margin-top:20px;">
            <button class="btn btn-main" id="quiz-restart">再来一次</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 听写练习 -->
    <div id="write" class="panel">
      <div class="card">
        <div class="mode-btns">
          <button class="mode-btn active" data-wmode="r2k">看罗马音写假名</button>
          <button class="mode-btn" data-wmode="k2r">看假名写罗马音</button>
        </div>

        <div id="write-main">
          <div class="progress-wrap"><div class="progress-bar" id="write-bar"></div></div>
          <div class="score-line">
            <span>第 <b id="write-cur">1</b> / <span id="write-total">15</span> 题</span>
            <span>正确 <b id="write-ok">0</b></span>
          </div>

          <div class="q-roma" id="write-prompt"></div>
          <div class="q-hint" id="write-hint">请输入对应的平假名</div>

          <div class="input-wrap">
            <input type="text" id="write-input" placeholder="在这里输入..." autocomplete="off" />
          </div>
          <div class="feedback" id="write-fb"></div>

          <div class="btn-row">
            <button class="btn btn-sub" id="write-skip">跳过</button>
            <button class="btn btn-speak" id="write-speak">🔊 发音</button>
            <button class="btn btn-main" id="write-check">确认</button>
            <button class="btn btn-main hidden" id="write-next">下一题</button>
          </div>
        </div>

        <div class="result hidden" id="write-result">
          <h2>听写完成！</h2>
          <div class="big" id="write-score">0%</div>
          <p id="write-msg"></p>
          <div class="btn-row" style="margin-top:20px;">
            <button class="btn btn-main" id="write-restart">再来一次</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 句子练习 -->
    <div id="sentence" class="panel">
      <div class="card">
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">全部句子</button>
          <button class="filter-btn" data-filter="basic">基础清音</button>
          <button class="filter-btn" data-filter="daku">含浊音</button>
        </div>
        <div id="sentence-list"></div>
      </div>
    </div>

    <footer>
      点击假名或句子可使用浏览器日语发音 · 建议配合手写练习
    </footer>
  </div>

  <script>
    // ===================== 数据 =====================
    const seion = [
      {k:"あ",r:"a"},{k:"い",r:"i"},{k:"う",r:"u"},{k:"え",r:"e"},{k:"お",r:"o"},
      {k:"か",r:"ka"},{k:"き",r:"ki"},{k:"く",r:"ku"},{k:"け",r:"ke"},{k:"こ",r:"ko"},
      {k:"さ",r:"sa"},{k:"し",r:"shi"},{k:"す",r:"su"},{k:"せ",r:"se"},{k:"そ",r:"so"},
      {k:"た",r:"ta"},{k:"ち",r:"chi"},{k:"つ",r:"tsu"},{k:"て",r:"te"},{k:"と",r:"to"},
      {k:"な",r:"na"},{k:"に",r:"ni"},{k:"ぬ",r:"nu"},{k:"ね",r:"ne"},{k:"の",r:"no"},
      {k:"は",r:"ha"},{k:"ひ",r:"hi"},{k:"ふ",r:"fu"},{k:"へ",r:"he"},{k:"ほ",r:"ho"},
      {k:"ま",r:"ma"},{k:"み",r:"mi"},{k:"む",r:"mu"},{k:"め",r:"me"},{k:"も",r:"mo"},
      {k:"や",r:"ya"},{k:"ゆ",r:"yu"},{k:"よ",r:"yo"},
      {k:"ら",r:"ra"},{k:"り",r:"ri"},{k:"る",r:"ru"},{k:"れ",r:"re"},{k:"ろ",r:"ro"},
      {k:"わ",r:"wa"},{k:"を",r:"wo"},{k:"ん",r:"n"}
    ];
    const daku = [
      {k:"が",r:"ga"},{k:"ぎ",r:"gi"},{k:"ぐ",r:"gu"},{k:"げ",r:"ge"},{k:"ご",r:"go"},
      {k:"ざ",r:"za"},{k:"じ",r:"ji"},{k:"ず",r:"zu"},{k:"ぜ",r:"ze"},{k:"ぞ",r:"zo"},
      {k:"だ",r:"da"},{k:"ぢ",r:"di"},{k:"づ",r:"du"},{k:"で",r:"de"},{k:"ど",r:"do"},
      {k:"ば",r:"ba"},{k:"び",r:"bi"},{k:"ぶ",r:"bu"},{k:"べ",r:"be"},{k:"ぼ",r:"bo"},
      {k:"ぱ",r:"pa"},{k:"ぴ",r:"pi"},{k:"ぷ",r:"pu"},{k:"ぺ",r:"pe"},{k:"ぽ",r:"po"}
    ];
    const allKana = [...seion, ...daku];

    const sentences = [
      { jp: "あさ から よる まで べんきょう します。", roma: "asa kara yoru made benkyou shimasu", zh: "从早上到晚上都学习。", type: "basic" },
      { jp: "いぬ と ねこ が うち に います。", roma: "inu to neko ga uchi ni imasu", zh: "家里有狗和猫。", type: "basic" },
      { jp: "うみ で およぎました。", roma: "umi de oyogimashita", zh: "在海里游泳了。", type: "basic" },
      { jp: "えき の まえ で ともだち に あいました。", roma: "eki no mae de tomodachi ni aimashita", zh: "在车站前面遇到了朋友。", type: "basic" },
      { jp: "おかし を かって たべました。", roma: "okashi o katte tabemashita", zh: "买了点心吃了。", type: "basic" },
      { jp: "かさ を わすれました。", roma: "kasa o wasuremashita", zh: "忘带伞了。", type: "basic" },
      { jp: "きのう は あめ が ふりました。", roma: "kinou wa ame ga furimashita", zh: "昨天下雨了。", type: "basic" },
      { jp: "くすり を のみました。", roma: "kusuri o nomimashita", zh: "吃药了。", type: "basic" },
      { jp: "けしき が とても きれい です。", roma: "keshiki ga totemo kirei desu", zh: "风景非常漂亮。", type: "basic" },
      { jp: "こども が こうえん で あそんでいます。", roma: "kodomo ga kouen de asondeimasu", zh: "小孩子在公园里玩。", type: "basic" },
      { jp: "さかな を たべる の が すき です。", roma: "sakana o taberu no ga suki desu", zh: "我喜欢吃鱼。", type: "basic" },
      { jp: "しんぶん を よみました。", roma: "shinbun o yomimashita", zh: "看了报纸。", type: "basic" },
      { jp: "すし を たべに いきましょう。", roma: "sushi o tabe ni ikimashou", zh: "去吃寿司吧。", type: "basic" },
      { jp: "せかい は ひろい です。", roma: "sekai wa hiroi desu", zh: "世界很大。", type: "basic" },
      { jp: "そら が あおい です。", roma: "sora ga aoi desu", zh: "天空是蓝色的。", type: "basic" },
      { jp: "がっこう に いきます。", roma: "gakkou ni ikimasu", zh: "去学校。", type: "daku" },
      { jp: "じしょ を かいました。", roma: "jisho o kaimashita", zh: "买了字典。", type: "daku" },
      { jp: "でんわ を してください。", roma: "denwa o shite kudasai", zh: "请打电话。", type: "daku" },
      { jp: "ばら の はな が きれい です。", roma: "bara no hana ga kirei desu", zh: "玫瑰花很漂亮。", type: "daku" },
      { jp: "パン を たべました。", roma: "pan o tabemashita", zh: "吃了面包。", type: "daku" },
      { jp: "みず を のみたい です。", roma: "mizu o nomitai desu", zh: "想喝水。", type: "basic" },
      { jp: "やま に のぼりました。", roma: "yama ni noborimashita", zh: "爬了山。", type: "basic" },
      { jp: "りんご を ひとつ ください。", roma: "ringo o hitotsu kudasai", zh: "请给我一个苹果。", type: "basic" },
      { jp: "はな が さいて います。", roma: "hana ga saite imasu", zh: "花开了。", type: "basic" },
      { jp: "ともだち と あそびました。", roma: "tomodachi to asobimashita", zh: "和朋友一起玩了。", type: "basic" }
    ];

    // ===================== 工具 =====================
    function shuffle(a) {
      const arr = [...a];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function sample(arr, n) { return shuffle(arr).slice(0, n); }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    // ===================== 五十音图 =====================
    function renderChart() {
      const g1 = document.getElementById("grid-seion");
      const g2 = document.getElementById("grid-daku");
      seion.forEach(item => {
        const d = document.createElement("div");
        d.className = "kana-item";
        d.innerHTML = `<span class="k">${item.k}</span><span class="r">${item.r}</span>`;
        d.onclick = () => speak(item.k);
        g1.appendChild(d);
      });
      daku.forEach(item => {
        const d = document.createElement("div");
        d.className = "kana-item";
        d.innerHTML = `<span class="k">${item.k}</span><span class="r">${item.r}</span>`;
        d.onclick = () => speak(item.k);
        g2.appendChild(d);
      });
    }

    // ===================== Tab =====================
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    // ===================== 认读练习 =====================
    let quizMode = "k2r", quizList = [], quizIdx = 0, quizOk = 0, quizDone = false;

    document.querySelectorAll("[data-mode]").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll("[data-mode]").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        quizMode = b.dataset.mode;
        startQuiz();
      };
    });

    function startQuiz() {
      quizList = sample(allKana, 20);
      quizIdx = 0; quizOk = 0; quizDone = false;
      document.getElementById("quiz-main").classList.remove("hidden");
      document.getElementById("quiz-result").classList.add("hidden");
      document.getElementById("quiz-total").textContent = quizList.length;
      showQuiz();
    }

    function showQuiz() {
      quizDone = false;
      const item = quizList[quizIdx];
      document.getElementById("quiz-cur").textContent = quizIdx + 1;
      document.getElementById("quiz-ok").textContent = quizOk;
      document.getElementById("quiz-bar").style.width = (quizIdx / quizList.length * 100) + "%";
      document.getElementById("quiz-fb").textContent = "";
      document.getElementById("quiz-fb").className = "feedback";
      document.getElementById("quiz-next").classList.add("hidden");
      document.getElementById("quiz-skip").classList.remove("hidden");

      const opts = document.getElementById("quiz-opts");
      opts.innerHTML = "";

      if (quizMode === "k2r") {
        document.getElementById("quiz-kana").textContent = item.k;
        document.getElementById("quiz-kana").classList.remove("hidden");
        document.getElementById("quiz-roma").classList.add("hidden");
        document.getElementById("quiz-hint").textContent = "请选择正确的罗马音";
        let choices = [item.r];
        while (choices.length < 4) {
          const r = allKana[Math.floor(Math.random() * allKana.length)].r;
          if (!choices.includes(r)) choices.push(r);
        }
        shuffle(choices).forEach(c => {
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.textContent = c;
          btn.onclick = () => checkQuiz(c, item.r, btn);
          opts.appendChild(btn);
        });
      } else {
        document.getElementById("quiz-roma").textContent = item.r;
        document.getElementById("quiz-roma").classList.remove("hidden");
        document.getElementById("quiz-kana").classList.add("hidden");
        document.getElementById("quiz-hint").textContent = "请选择正确的平假名";
        let choices = [item.k];
        while (choices.length < 4) {
          const k = allKana[Math.floor(Math.random() * allKana.length)].k;
          if (!choices.includes(k)) choices.push(k);
        }
        shuffle(choices).forEach(c => {
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.textContent = c;
          btn.onclick = () => checkQuiz(c, item.k, btn);
          opts.appendChild(btn);
        });
      }
    }

    function checkQuiz(sel, correct, btn) {
      if (quizDone) return;
      quizDone = true;
      document.getElementById("quiz-skip").classList.add("hidden");
      document.querySelectorAll("#quiz-opts .opt").forEach(b => {
        b.disabled = true;
        if (b.textContent === correct) b.classList.add("correct");
      });
      if (sel === correct) {
        quizOk++;
        document.getElementById("quiz-fb").textContent = "正确！";
        document.getElementById("quiz-fb").className = "feedback ok";
        btn.classList.add("correct");
      } else {
        document.getElementById("quiz-fb").textContent = "错误，正确答案：" + correct;
        document.getElementById("quiz-fb").className = "feedback ng";
        btn.classList.add("wrong");
      }
      document.getElementById("quiz-ok").textContent = quizOk;
      document.getElementById("quiz-next").classList.remove("hidden");
    }

    document.getElementById("quiz-next").onclick = () => {
      quizIdx++;
      if (quizIdx >= quizList.length) endQuiz();
      else showQuiz();
    };
    document.getElementById("quiz-skip").onclick = () => {
      quizIdx++;
      if (quizIdx >= quizList.length) endQuiz();
      else showQuiz();
    };
    document.getElementById("quiz-speak").onclick = () => {
      const item = quizList[quizIdx];
      speak(item.k);
    };
    document.getElementById("quiz-restart").onclick = startQuiz;

    function endQuiz() {
      document.getElementById("quiz-main").classList.add("hidden");
      document.getElementById("quiz-result").classList.remove("hidden");
      const p = Math.round(quizOk / quizList.length * 100);
      document.getElementById("quiz-score").textContent = p + "%";
      document.getElementById("quiz-msg").textContent =
        p >= 90 ? "非常棒！已经掌握得很好了！" :
        p >= 70 ? "不错，再多练几次会更熟练。" :
        p >= 50 ? "继续加油，多看五十音图再来。" : "建议先熟悉五十音图，再重新练习。";
    }

    // ===================== 听写练习 =====================
    let writeMode = "r2k", writeList = [], writeIdx = 0, writeOk = 0, writeDone = false;

    document.querySelectorAll("[data-wmode]").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll("[data-wmode]").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        writeMode = b.dataset.wmode;
        startWrite();
      };
    });

    function startWrite() {
      writeList = sample(seion, 15);
      writeIdx = 0; writeOk = 0; writeDone = false;
      document.getElementById("write-main").classList.remove("hidden");
      document.getElementById("write-result").classList.add("hidden");
      document.getElementById("write-total").textContent = writeList.length;
      showWrite();
    }

    function showWrite() {
      writeDone = false;
      const item = writeList[writeIdx];
      document.getElementById("write-cur").textContent = writeIdx + 1;
      document.getElementById("write-ok").textContent = writeOk;
      document.getElementById("write-bar").style.width = (writeIdx / writeList.length * 100) + "%";
      document.getElementById("write-fb").textContent = "";
      document.getElementById("write-fb").className = "feedback";
      document.getElementById("write-next").classList.add("hidden");
      document.getElementById("write-check").classList.remove("hidden");
      document.getElementById("write-skip").classList.remove("hidden");
      document.getElementById("write-input").value = "";
      document.getElementById("write-input").focus();

      if (writeMode === "r2k") {
        document.getElementById("write-prompt").textContent = item.r;
        document.getElementById("write-hint").textContent = "请输入对应的平假名";
      } else {
        document.getElementById("write-prompt").textContent = item.k;
        document.getElementById("write-hint").textContent = "请输入对应的罗马音";
      }
    }

    function checkWrite() {
      if (writeDone) return;
      const item = writeList[writeIdx];
      const input = document.getElementById("write-input").value.trim().toLowerCase();
      const correct = writeMode === "r2k" ? item.k : item.r;
      writeDone = true;
      document.getElementById("write-check").classList.add("hidden");
      document.getElementById("write-skip").classList.add("hidden");
      if (input === correct) {
        writeOk++;
        document.getElementById("write-fb").textContent = "正确！";
        document.getElementById("write-fb").className = "feedback ok";
      } else {
        document.getElementById("write-fb").textContent = "错误，正确答案：" + correct;
        document.getElementById("write-fb").className = "feedback ng";
      }
      document.getElementById("write-ok").textContent = writeOk;
      document.getElementById("write-next").classList.remove("hidden");
    }

    document.getElementById("write-check").onclick = checkWrite;
    document.getElementById("write-input").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        if (!writeDone) checkWrite();
        else document.getElementById("write-next").click();
      }
    });
    document.getElementById("write-next").onclick = () => {
      writeIdx++;
      if (writeIdx >= writeList.length) endWrite();
      else showWrite();
    };
    document.getElementById("write-skip").onclick = () => {
      writeIdx++;
      if (writeIdx >= writeList.length) endWrite();
      else showWrite();
    };
    document.getElementById("write-speak").onclick = () => {
      speak(writeList[writeIdx].k);
    };
    document.getElementById("write-restart").onclick = startWrite;

    function endWrite() {
      document.getElementById("write-main").classList.add("hidden");
      document.getElementById("write-result").classList.remove("hidden");
      const p = Math.round(writeOk / writeList.length * 100);
      document.getElementById("write-score").textContent = p + "%";
      document.getElementById("write-msg").textContent =
        p >= 90 ? "写得非常准确！继续保持。" :
        p >= 70 ? "不错，再多写几遍会更熟练。" : "建议先多看五十音图，再回来听写。";
    }

    // ===================== 句子 =====================
    function renderSentences(filter = "all") {
      const list = document.getElementById("sentence-list");
      list.innerHTML = "";
      const data = filter === "all" ? sentences : sentences.filter(s => s.type === filter);
      data.forEach(s => {
        const div = document.createElement("div");
        div.className = "sentence-card";
        div.innerHTML = `
          <div class="sentence-jp">${s.jp}</div>
          <div class="sentence-roma">${s.roma}</div>
          <div class="sentence-zh">${s.zh}</div>
          <div class="sentence-actions">
            <button onclick="speak('${s.jp.replace(/'/g, "\\'")}')">🔊 发音</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    document.querySelectorAll(".filter-btn").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        renderSentences(b.dataset.filter);
      };
    });

    // ===================== 初始化 =====================
    renderChart();
    startQuiz();
    startWrite();
    renderSentences();
  </script>
</body>
</html>
